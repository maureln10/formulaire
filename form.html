    <hr>
    <form action="" method="post">
        <h1>Bienvenue sur mon formulaire</h1>
        <label for="Nom">Nom :</label><br>
        <input type="text" placeholder="Entrer votre nom !" id="nom" name="nom" required><br><br>
        <label for="prenom">Prenom :</label><br>
        <input type="text" placeholder="Entrer votre premom !" id="premom" name="prenom" required><br><br>
        <label for="mdp">Mot de passe :</label><br>
        <input type="password" placeholder="Entrer votre mot de passe !" id="mdp" name="mdp" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"><br><br>
        <button class="btn" type="submit">Envoyer</button><br><br>

    </form>
